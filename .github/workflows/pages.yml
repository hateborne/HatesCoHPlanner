# Build and publish the site from main. Started by hand only (Actions -> Deploy to GitHub Pages ->
# Run workflow, or `gh workflow run pages.yml --ref main -f bump=minor`), so a run of merges deploys
# once, when the owner chooses, instead of once per merge. Deploys run one at a time: a run started
# while one is running waits for it (only the newest waiting run is kept), so an older build can
# never finish last and overwrite a newer one. Actions are pinned to release commit SHAs.
#
# Each deploy is a release (AGENTS.md, "Versions and releases"): the bump picked here makes the next
# vX.Y.Z (scripts/release-version.mjs), the build shows it in the footer, and the release job tags it
# and publishes its notes before the site goes live, so a failed deploy can't let another build take
# the same number. A commit that already carries a version deploys again under it, with no new tag,
# and so does one that changes nothing the site is built from since the newest version (docs, tests,
# CI, tooling: docs/releases.md, "What counts as a new version").
name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump: major (massive feature changes, redesigns), minor (a new server, medium-sized work), patch (fixes, small changes)'
        type: choice
        required: true
        default: pick one
        options:
          - pick one
          - patch
          - minor
          - major

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      fresh: ${{ steps.version.outputs.fresh }}
      previous: ${{ steps.version.outputs.previous }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      # the Run workflow button lets any branch be picked; only main is ever published
      - name: Refuse branches other than main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Deploys run from main only (this run was started on ${GITHUB_REF})."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # the version this deploy publishes (the input goes in through the environment, never the script text)
      - name: Pick the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: node scripts/release-version.mjs "$BUMP"
      # the players' lines new in this version (CHANGELOG.md), for the top of its release notes; a
      # failure here is flagged on the run and leaves the notes to the pull request list, since the
      # notes can be edited afterwards and must never hold a deploy back
      - name: Read the changelog
        id: notes
        if: steps.version.outputs.fresh == 'true'
        continue-on-error: true
        env:
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: node scripts/release-notes.mjs "$PREVIOUS"
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
        env:
          HCP_VERSION: ${{ steps.version.outputs.version }}
          HCP_COMMIT: ${{ github.sha }}
      # (no configure-pages step: this build's base path is GitHub Pages' own, the default in vite.config.ts)
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      # The same site for its own domain (docs/hosting.md): built for the root path, given
      # pre-compressed copies of its text files, and packed into one file with its checksum. The
      # release carries both, and the host there fetches them. Only a new version gets them: a
      # deploy under a version that exists already changes nothing the site is built from.
      - name: Build and pack the site for its own domain
        if: steps.version.outputs.fresh == 'true'
        env:
          HCP_BASE: /
          HCP_VERSION: ${{ steps.version.outputs.version }}
          HCP_COMMIT: ${{ github.sha }}
        run: |
          npx vite build --outDir dist-own
          node scripts/precompress.mjs dist-own
          tar -czf planner-site.tar.gz -C dist-own .
          sha256sum planner-site.tar.gz > planner-site.tar.gz.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.version.outputs.fresh == 'true'
        with:
          name: own-domain-site
          path: |
            planner-site.tar.gz
            planner-site.tar.gz.sha256
          if-no-files-found: error
          # a re-run of this job replaces the earlier upload instead of failing on its name
          overwrite: true
          retention-days: 7

  # tag the new version and publish its notes (the changelog's new lines for players, then the pull
  # requests merged since the last release); skipped when the commit already carries a version
  release:
    needs: build
    if: needs.build.outputs.fresh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # the site packed for its own domain, and its checksum (the build job's last steps)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: own-domain-site
      - name: Tag the release and publish its notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PREVIOUS: ${{ needs.build.outputs.previous }}
          NOTES: ${{ needs.build.outputs.notes }}
        # gh puts --notes above the generated list; with no new changelog lines the list stands alone.
        # The two files after the tag are attached to the release, which is published only once
        # both are up: the newest release always has its site file.
        run: |
          set -- "v${VERSION}" planner-site.tar.gz planner-site.tar.gz.sha256 --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "v${VERSION}" --generate-notes --notes-start-tag "${PREVIOUS}"
          if [ -n "${NOTES}" ]; then set -- "$@" --notes "${NOTES}"; fi
          gh release create "$@"

  deploy:
    needs: [build, release]
    # after a new version is tagged, or straight away for a commit that already had one
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
