# Build and publish the site from main. Started by hand only (Actions -> Deploy to GitHub Pages ->
# Run workflow, or `gh workflow run pages.yml --ref main`), so a run of merges deploys once, when
# the owner chooses, instead of once per merge. Deploys run one at a time: a run started while one
# is running waits for it (only the newest waiting run is kept), so an older build can never finish
# last and overwrite a newer one. Actions are pinned to release commit SHAs.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # the Run workflow button lets any branch be picked; only main is ever published
      - name: Refuse branches other than main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Deploys run from main only (this run was started on ${GITHUB_REF})."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      # (no configure-pages step: the site's base path is fixed in vite.config.ts)
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
