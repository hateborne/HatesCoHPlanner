# Checks every pull request into main must pass before it can merge (see the main branch ruleset).
# The browser tests are the exception for now: they run and report on every pull request, but the
# ruleset does not list them yet (docs/releases.md).
# Actions are pinned to release commit SHAs; the comment names the release.
#
# The checks are main's: `pull_request_target` runs this file as main has it, never a pull request's
# copy, so a branch can't change or drop the checks its own merge is held to. An edit to this file
# takes effect once it is merged. Each job checks out the pull request's own commit and tests that.
# That code is not trusted, so nothing here may give it more than this: a read-only token (the
# permissions below, credentials never kept), no secrets, and no cache (a cache saved here would
# land in main's scope, where a pull request's code could leave something for main's runs).
name: CI

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # no install scripts: a compromised dependency can't run code at install time (esbuild,
      # the only package with one, works without it)
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The browser tests (e2e/, `npm run e2e`): whole builds recreated through the planner's own
  # screens, on the desktop and the phone layout. What the check does differently from a run at
  # home (its browser, four workers, no traces, no `test.only`) is in playwright.config.ts, by CI.
  browser:
    name: Browser tests (builds recreated through the screens)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      # Playwright's own Chromium, the build its version in package-lock.json names: the browser
      # changes only when a pull request changes that version, never under one that did not. (The
      # runner's own Chrome moves with GitHub's image.) Downloaded each run, since nothing is cached.
      # Three tries; if its download site stays down, the tests run in the runner's own Chrome
      # instead (HCP_E2E_BROWSER tells playwright.config.ts) and the run carries a warning, so an
      # outage elsewhere never fails a pull request.
      - name: Playwright's Chromium, or the runner's Chrome
        run: |
          for try in 1 2 3; do
            if npx playwright install --no-shell chromium; then exit 0; fi
            echo "Download try ${try} of 3 failed."
            if [ "${try}" != 3 ]; then sleep 10; fi
          done
          chrome="$(google-chrome --version)"
          echo "::warning::Playwright's Chromium could not be downloaded, so the browser tests ran in the runner's own ${chrome% }."
          echo "HCP_E2E_BROWSER=chrome" >> "${GITHUB_ENV}"
      # The step's own time limit is under the job's, so a run that hangs fails here and the step
      # below still keeps what it left.
      - name: Browser tests
        timeout-minutes: 25
        env:
          # boosted.spec.ts deals its treatments from a random seed: one fixed deal here, so a pull
          # request never fails on a deal that is not its own doing (a local run stays random)
          HCP_E2E_SEED: 20261128
        run: npm run e2e
      # What a failed test left (a picture of the screen and its error note; no trace, which would
      # be some 400 MB a walk), to download from the run. It belongs to this run alone: unlike a
      # cache, no other run is handed it.
      - name: Keep what the failed tests left
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-tests-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # what ships to visitors (React, zustand, brotli-wasm) must have no known advisories at all
      - name: Shipped dependencies
        run: npm audit --omit=dev --audit-level=moderate
      # build and test tools: high and critical advisories fail the check, except the few
      # scripts/audit-dev.mjs allows (each with its reason) until a fixed release exists
      - name: Development tools
        run: node scripts/audit-dev.mjs

  pipeline:
    name: Data pipeline (Python compiles)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m compileall -q pipeline tools
      # the pipeline checks that need no game files (the rest run on the owner's machine): the
      # release check (its manifests are written by the test, no network), the forced respec check,
      # the difference report between servers and the pseudo-pet export (synthetic data, no client),
      # and the stable ids check itself (in a throwaway repository)
      - name: Pipeline unit tests
        run: python -m unittest pipeline.watch_test pipeline.forced_respec_test pipeline.compare_test pipeline.pets_test pipeline.henchmen_test pipeline.info_test pipeline.pvp_test pipeline.recipes_test pipeline.check_ids_test pipeline.patch_history_test pipeline.mids_map_test
      # share links and saved builds store these ids: none may change or disappear
      - name: Stable IDs are only appended to
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/${BASE}:refs/remotes/origin/${BASE}"
          python pipeline/check_ids.py "origin/${BASE}"
      - name: JSON files parse
        run: |
          python - <<'EOF'
          import json, pathlib
          bad = []
          for p in [*pathlib.Path('public/data').rglob('*.json'), *pathlib.Path('pipeline').glob('*.json')]:
              try:
                  json.loads(p.read_text(encoding='utf-8'))
              except ValueError as e:
                  bad.append(f'{p}: {e}')
          if bad:
              raise SystemExit('\n'.join(bad))
          EOF

  privacy:
    name: Privacy (no local paths or machine settings)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Machine settings are not tracked
        run: |
          if git ls-files --error-unmatch pipeline/paths.local.json >/dev/null 2>&1; then
            echo "pipeline/paths.local.json holds machine paths and must stay untracked"; exit 1
          fi
      - name: No local machine paths in tracked text files
        run: |
          # any drive-letter path, network share path or Linux / macOS home folder path (the
          # three patterns below, in that order); machine paths belong in
          # pipeline/paths.local.json (untracked) or environment variables
          found=0
          for pattern in \
            '(^|[^A-Za-z0-9])[A-Za-z]:(\\\\|\\|/)[A-Za-z0-9._$]' \
            '(^|[^\\])\\\\[A-Za-z0-9._-]+\\[A-Za-z0-9$._-]+' \
            '(^|[^A-Za-z0-9.])/(home|Users)/[A-Za-z0-9._-]+/'; do
            if git grep -nIE "$pattern" -- . ':!package-lock.json'; then found=1; fi
          done
          if [ "$found" = 1 ]; then
            echo "Remove the local paths above (use pipeline/paths.local.json or environment variables)"; exit 1
          fi
